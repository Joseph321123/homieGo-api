services:
  postgres:
    image: postgres:16-alpine
    container_name: homiego-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: homiego_db
      POSTGRES_USER: homiego_user
      POSTGRES_PASSWORD: homiego_pass
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - homiego_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homiego_user -d homiego_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: homiego-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  homiego_postgres_data:
    name: homiego_postgres_data
